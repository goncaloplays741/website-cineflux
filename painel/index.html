<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:20px;min-height:100vh}
.login-box{max-width:350px;margin:100px auto;background:#1a1a1a;padding:40px;border-radius:12px;border:1px solid #333;text-align:center}
.login-box h1{font-size:22px;margin-bottom:8px;color:#e50914}
.login-box p{font-size:13px;color:#888;margin-bottom:30px}
.login-box input{width:100%;padding:12px 16px;background:#222;border:1px solid #444;border-radius:6px;color:#fff;font-size:15px;margin-bottom:16px;outline:none}
.login-box input:focus{border-color:#e50914}
.login-box button{width:100%;padding:12px;background:#e50914;border:none;border-radius:6px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:hover{background:#b20710}
.login-box .erro{color:#e50914;font-size:13px;margin-top:12px;display:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px}
.header h1{font-size:24px}
.header h1 span{color:#e50914}
.header .acoes{display:flex;gap:10px}
.header .acoes button{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:none}
.btn-sair{background:#e50914;color:#fff}
.btn-sair:hover{background:#b20710}
.btn-cinza{background:#333;color:#fff}
.btn-cinza:hover{background:#555}
.btn-verde{background:#1a6b1a;color:#fff}
.btn-verde:hover{background:#238823}
.oculto{display:none}
.stats{display:flex;gap:20px;margin-bottom:25px;flex-wrap:wrap}
.stat-card{background:#1a1a1a;padding:18px 24px;border-radius:10px;border:1px solid #333;min-width:140px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:#e50914}
.stat-card .label{font-size:12px;color:#888;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.wrap{background:#1a1a1a;border-radius:10px;border:1px solid #333;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#222;padding:12px 16px;text-align:left;color:#888;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;border-bottom:1px solid #333;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid #2a2a2a;color:#ccc;max-width:250px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#222}
.ip-cell{font-family:monospace;color:#fff;font-weight:500}
.date-cell{color:#888;font-size:12px;white-space:nowrap}
.ua-cell{font-size:11px;color:#777}
.vazio{text-align:center;padding:60px 20px;color:#555;font-size:16px}
@media(max-width:768px){
  .header h1{font-size:18px}
  .stat-card{min-width:100px;padding:14px 16px}
  .stat-card .num{font-size:22px}
  th,td{padding:8px 10px;font-size:12px}
  .ua-cell,.ref-cell{display:none}
}
</style>
</head>
<body>
<div id="loginBox" class="login-box">
  <h1>Painel CineFlux</h1>
  <p>Acesso restrito</p>
  <input type="password" id="senhaInput" placeholder="Senha" autofocus>
  <button onclick="fazerLogin()">Entrar</button>
  <div class="erro" id="erroMsg"></div>
</div>

<div id="dashboard" class="oculto">
  <div class="header">
    <h1><span>CineFlux</span> — IP Tracker</h1>
    <div class="acoes">
      <button class="btn-cinza" onclick="limparLogs()">Limpar</button>
      <button class="btn-verde" onclick="carregarDados()">Atualizar</button>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>
  <div class="stats" id="statsRow"></div>
  <div class="wrap">
    <table>
      <thead><tr><th>Data/Hora</th><th>IP</th><th class="ua-cell">User Agent</th><th class="ref-cell">Referer</th><th>Pagina</th></tr></thead>
      <tbody id="tabelaBody"></tbody>
    </table>
  </div>
</div>

<script>
const API = '/api/admin';

function mostrarErro(msg) {
  const el = document.getElementById('erroMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function fazerLogin() {
  const senha = document.getElementById('senhaInput').value;
  if (!senha) return;
  document.getElementById('erroMsg').style.display = 'none';
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: senha})
    });
    const data = await res.json();
    if (data.error) {
      mostrarErro(data.error);
    } else if (data.ok) {
      sessionStorage.setItem('adm_senha', senha);
      renderDashboard(data);
    }
  } catch (e) {
    mostrarErro('Erro de conexao');
  }
}

function renderDashboard(data) {
  document.getElementById('loginBox').classList.add('oculto');
  document.getElementById('dashboard').classList.remove('oculto');
  document.getElementById('senhaInput').value = '';

  const {stats, visits} = data;
  document.getElementById('statsRow').innerHTML =
    '<div class="stat-card"><div class="num">' + stats.total + '</div><div class="label">Total Visitas</div></div>' +
    '<div class="stat-card"><div class="num">' + stats.today + '</div><div class="label">Hoje</div></div>' +
    '<div class="stat-card"><div class="num">' + stats.unique + '</div><div class="label">IPs Unicos</div></div>' +
    '<div class="stat-card"><div class="num">' + new Date().toLocaleString('pt-BR') + '</div><div class="label">Atualizado</div></div>';

  if (!visits || visits.length === 0) {
    document.getElementById('tabelaBody').innerHTML = '<tr><td colspan="5" class="vazio">Nenhum visitante registrado</td></tr>';
    return;
  }

  document.getElementById('tabelaBody').innerHTML = visits.map(function(v) {
    return '<tr>' +
      '<td class="date-cell">' + esc(v.time) + '</td>' +
      '<td class="ip-cell">' + esc(v.ip) + '</td>' +
      '<td class="ua-cell" title="' + esc(v.ua) + '">' + trunc(esc(v.ua), 60) + '</td>' +
      '<td class="ref-cell" title="' + esc(v.ref) + '">' + trunc(esc(v.ref), 40) + '</td>' +
      '<td>' + esc(v.page) + '</td>' +
      '</tr>';
  }).join('');
}

async function carregarDados() {
  const senha = sessionStorage.getItem('adm_senha');
  if (!senha) return sair();
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: senha})
    });
    const data = await res.json();
    if (data.ok) renderDashboard(data);
    else sair();
  } catch (e) {
    sair();
  }
}

async function limparLogs() {
  if (!confirm('Limpar todos os logs?')) return;
  const senha = sessionStorage.getItem('adm_senha');
  try {
    await fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: senha, action: 'clear'})
    });
    carregarDados();
  } catch (e) {}
}

function sair() {
  sessionStorage.removeItem('adm_senha');
  document.getElementById('dashboard').classList.add('oculto');
  document.getElementById('loginBox').classList.remove('oculto');
  document.getElementById('senhaInput').focus();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function trunc(s, n) {
  if (!s) return '';
  return s.length > n ? s.slice(0, n) + '...' : s;
}

// Auto-login on page load
(function() {
  const stored = sessionStorage.getItem('adm_senha');
  if (stored) {
    fetch(API, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: stored})
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.ok) renderDashboard(data);
    }).catch(function() {});
  }
})();

document.getElementById('senhaInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') fazerLogin();
});
</script>
</body>
</html>
